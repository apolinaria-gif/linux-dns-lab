[dns_master]
ns01 ansible_host=192.168.50.10 ansible_ssh_private_key_file=/home/vagrant/.ssh/ns01

[dns_slave]
ns02 ansible_host=192.168.50.11 ansible_ssh_private_key_file=/home/vagrant/.ssh/ns02

[dns_clients]
client ansible_host=192.168.50.15 ansible_ssh_private_key_file=/home/vagrant/.ssh/client
client2 ansible_host=192.168.50.16 ansible_ssh_private_key_file=/home/vagrant/.ssh/client2

[all:vars]
ansible_user=vagrant
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes

